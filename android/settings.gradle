// Fail early with a readable message instead of a cryptic "project directory does not exist".
// The Capacitor Gradle modules live in ../node_modules and the cordova stub module is generated by `cap sync`.
if (!new File(rootDir, '../node_modules/@capacitor/android/capacitor').exists()
        || !new File(rootDir, 'capacitor-cordova-android-plugins').exists()) {
    throw new GradleException(
        "Capacitor files are missing. In the repo root (the folder above 'android') run:\n" +
        "    npm install\n    npx cap sync android\n" +
        "then sync Gradle again.")
}

// Shown as the project name in Android Studio (otherwise it would just be "android").
rootProject.name = 'Emberhold'

include ':app'
include ':capacitor-cordova-android-plugins'
project(':capacitor-cordova-android-plugins').projectDir = new File('./capacitor-cordova-android-plugins/')

apply from: 'capacitor.settings.gradle'