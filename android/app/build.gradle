apply plugin: 'com.android.application'

android {
    namespace = "com.example.rpgprototype"
    compileSdk = rootProject.ext.compileSdkVersion
    buildToolsVersion = rootProject.ext.buildToolsVersion
    defaultConfig {
        applicationId "com.example.rpgprototype"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Override with -PversionCode=2 -PversionName=1.1 (gradle.properties or the command line).
        versionCode((project.findProperty("versionCode") ?: "1").toString().toInteger())
        versionName((project.findProperty("versionName") ?: "1.0").toString())
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures {
        buildConfig = true
    }
    buildTypes {
        debug {
            // Installs next to a release build instead of replacing it, and is labelled on the home screen (see src/debug/res/values/strings.xml).
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            buildConfigField "boolean", "DEBUG_TOOLS", "true"
        }
        release {
            buildConfigField "boolean", "DEBUG_TOOLS", "false"
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

// Rebuild the web bundle and copy it into the app before every debug build, so pressing Run in Android
// Studio always installs the current game code (uses `npm run build:s25` = tsc + vite + cap sync).
// Skip with -PskipWebBuild=true (e.g. live reload via CAP_SERVER_URL, or when you built it yourself).
def isWindows = org.gradle.internal.os.OperatingSystem.current().isWindows()
def repoRoot = rootProject.projectDir.parentFile
def nativeToolsPresent = {
    // node_modules is installed per OS: Windows Gradle needs the win32 build tools, WSL/Linux the linux ones.
    new File(repoRoot, "node_modules/@esbuild/" + (isWindows ? "win32-x64" : "linux-x64")).exists()
}
tasks.register('syncWebAssets', Exec) {
    group = 'build'
    description = 'Builds the web bundle (npm run build:s25) and copies it into the Android project.'
    workingDir repoRoot
    commandLine(isWindows ? ['cmd', '/c', 'npm', 'run', 'build:s25'] : ['npm', 'run', 'build:s25'])
    onlyIf {
        if (project.findProperty('skipWebBuild') == 'true') return false
        if (!nativeToolsPresent()) {
            logger.warn("syncWebAssets skipped: node_modules has no build tools for this OS. " +
                "Run `npm run build:s25` yourself (from WSL if that is where you ran npm install), " +
                "or run `npm install` from a ${isWindows ? 'Windows' : 'Linux'} terminal.")
            return false
        }
        return true
    }
}
tasks.matching { it.name == 'preDebugBuild' }.configureEach { dependsOn 'syncWebAssets' }

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
